services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: doku_payments
    ports:
      - '3306:3306'
    volumes:
      - doku-mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-proot']
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    ports:
      - '4010:4010'
    environment:
      NODE_ENV: production
      PORT: '4010'
      CORS_ORIGIN: http://localhost:8080
      DOKU_MOCK_MODE: '${DOKU_MOCK_MODE:-true}'
      DOKU_CLIENT_ID: '${DOKU_CLIENT_ID:-BRN-0000-000000000000000000}'
      DOKU_SECRET_KEY: '${DOKU_SECRET_KEY:-change_me_secret_key}'
      DOKU_BASE_URL: '${DOKU_BASE_URL:-https://api-sandbox.doku.com}'
      DOKU_MERCHANT_ID: '${DOKU_MERCHANT_ID:-YOUR_MERCHANT_ID}'
      PUBLIC_BASE_URL: '${PUBLIC_BASE_URL:-http://localhost:4010}'
      DB_ENABLED: 'true'
      DB_DIALECT: mysql
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_NAME: doku_payments
      DB_USER: root
      DB_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  doku-mysql:
