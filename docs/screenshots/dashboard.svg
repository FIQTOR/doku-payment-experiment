<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-label="Dashboard">
  <rect width="1100" height="640" fill="#f1f5f9"/>
  <g font-family="Inter, Arial, sans-serif">
    <!-- sidebar -->
    <rect x="0" y="0" width="230" height="640" fill="#ffffff"/>
    <text x="24" y="46" font-size="22" font-weight="800" fill="#1a73e8">DOKU</text>
    <rect x="16" y="80" width="198" height="38" rx="10" fill="#eef6ff"/>
    <text x="32" y="105" font-size="14" fill="#0a4ca6">▦ Dashboard</text>
    <text x="32" y="150" font-size="14" fill="#64748b">＋ Create Payment</text>
    <text x="32" y="190" font-size="14" fill="#64748b">☰ Transactions</text>
    <text x="32" y="230" font-size="14" fill="#64748b">🏦 Disbursements</text>
    <text x="32" y="270" font-size="14" fill="#64748b">📣 Webhook Tester</text>

    <!-- header -->
    <rect x="230" y="0" width="870" height="60" fill="#ffffff"/>
    <text x="260" y="38" font-size="20" font-weight="700" fill="#0f172a">Payment Dashboard</text>
    <rect x="920" y="16" width="150" height="30" rx="15" fill="url(#g2)"/>
    <text x="995" y="36" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">＋ New</text>

    <!-- stat cards -->
    <g>
      <rect x="260" y="86" width="196" height="76" rx="14" fill="#ffffff"/>
      <text x="284" y="115" font-size="12" fill="#94a3b8">Total Transactions</text>
      <text x="284" y="145" font-size="26" font-weight="800" fill="#0f172a">12</text>

      <rect x="472" y="86" width="196" height="76" rx="14" fill="#ffffff"/>
      <text x="496" y="115" font-size="12" fill="#94a3b8">Successful</text>
      <text x="496" y="145" font-size="26" font-weight="800" fill="#059669">9</text>

      <rect x="684" y="86" width="196" height="76" rx="14" fill="#ffffff"/>
      <text x="708" y="115" font-size="12" fill="#94a3b8">Pending</text>
      <text x="708" y="145" font-size="26" font-weight="800" fill="#d97706">2</text>

      <rect x="896" y="86" width="176" height="76" rx="14" fill="#ffffff"/>
      <text x="920" y="115" font-size="12" fill="#94a3b8">Collected</text>
      <text x="920" y="145" font-size="22" font-weight="800" fill="#7c3aed">Rp 1.4jt</text>
    </g>

    <!-- transaction list -->
    <rect x="260" y="186" width="580" height="420" rx="16" fill="#ffffff"/>
    <text x="286" y="218" font-size="15" font-weight="700" fill="#0f172a">Transactions</text>
    <g font-size="13">
      <rect x="286" y="240" width="528" height="58" rx="10" fill="#f8fafc"/>
      <text x="306" y="274" fill="#0f172a" font-weight="600">INV-1759…-A1B2</text>
      <text x="560" y="274" fill="#64748b">Rp 25.000</text>
      <rect x="720" y="256" width="74" height="24" rx="12" fill="#d1fae5"/>
      <text x="757" y="273" text-anchor="middle" font-size="12" fill="#059669">Success</text>

      <rect x="286" y="308" width="528" height="58" rx="10" fill="#f8fafc"/>
      <text x="306" y="342" fill="#0f172a" font-weight="600">INV-1759…-C3D4</text>
      <text x="560" y="342" fill="#64748b">Rp 50.000</text>
      <rect x="724" y="324" width="70" height="24" rx="12" fill="#fef3c7"/>
      <text x="759" y="341" text-anchor="middle" font-size="12" fill="#b45309">Pending</text>

      <rect x="286" y="376" width="528" height="58" rx="10" fill="#f8fafc"/>
      <text x="306" y="410" fill="#0f172a" font-weight="600">INV-1759…-E5F6</text>
      <text x="560" y="410" fill="#64748b">Rp 10.000</text>
      <rect x="716" y="392" width="78" height="24" rx="12" fill="#ede9fe"/>
      <text x="755" y="409" text-anchor="middle" font-size="12" fill="#7c3aed">Refunded</text>
    </g>

    <!-- create payment card -->
    <rect x="864" y="186" width="386" height="420" rx="16" fill="#ffffff"/>
    <text x="890" y="218" font-size="15" font-weight="700" fill="#0f172a">Create Payment</text>
    <rect x="890" y="236" width="158" height="40" rx="10" fill="#eef6ff"/>
    <text x="912" y="262" font-size="13" fill="#0a4ca6">◻ QRIS</text>
    <rect x="1060" y="236" width="164" height="40" rx="10" fill="#f8fafc"/>
    <text x="1082" y="262" font-size="13" fill="#64748b">💳 Checkout</text>

    <text x="890" y="312" font-size="12" fill="#94a3b8">Amount (IDR)</text>
    <rect x="890" y="322" width="334" height="42" rx="10" fill="#f8fafc"/>
    <text x="910" y="349" font-size="16" font-weight="700" fill="#0f172a">Rp 25.000</text>

    <text x="890" y="398" font-size="12" fill="#94a3b8">Description</text>
    <rect x="890" y="408" width="334" height="42" rx="10" fill="#f8fafc"/>
    <text x="910" y="435" font-size="14" fill="#334155">Pembayaran pesanan</text>

    <rect x="890" y="480" width="334" height="46" rx="12" fill="url(#g2)"/>
    <text x="1057" y="509" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Generate QRIS Payment</text>

    <rect x="890" y="546" width="334" height="40" rx="10" fill="#f1f5f9"/>
    <text x="1057" y="571" text-anchor="middle" font-size="12" fill="#64748b">🧪 Mock mode · no live DOKU calls</text>
  </g>
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b5fce"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
</svg>
