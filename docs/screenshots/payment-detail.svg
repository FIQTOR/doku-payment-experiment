<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-label="Payment detail">
  <rect width="720" height="560" fill="#e2e8f0"/>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="70" y="50" width="580" height="460" rx="20" fill="#ffffff"/>
    <!-- header -->
    <text x="100" y="100" font-size="18" font-weight="700" fill="#0f172a">DOKU payment</text>
    <text x="100" y="124" font-size="14" fill="#64748b">Rp 25.000</text>
    <rect x="556" y="84" width="64" height="26" rx="13" fill="#fef3c7"/>
    <text x="588" y="102" text-anchor="middle" font-size="12" fill="#b45309">Pending</text>

    <!-- QR block -->
    <rect x="100" y="150" width="180" height="180" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <g fill="#0f172a">
      <rect x="120" y="170" width="30" height="30"/><rect x="230" y="170" width="30" height="30"/><rect x="120" y="280" width="30" height="30"/>
      <rect x="165" y="215" width="14" height="14"/><rect x="200" y="240" width="14" height="14"/>
      <rect x="180" y="190" width="14" height="14"/><rect x="215" y="285" width="14" height="14"/>
      <rect x="150" y="250" width="14" height="14"/><rect x="235" y="230" width="14" height="14"/>
    </g>
    <text x="190" y="352" text-anchor="middle" font-size="12" fill="#64748b">Copy payload · SVG</text>

    <!-- detail rows -->
    <g font-size="13">
      <text x="320" y="172" fill="#94a3b8">Invoice No</text>
      <text x="620" y="172" text-anchor="end" fill="#334155" font-family="monospace">INV-1759…-A1B2</text>
      <line x1="320" y1="184" x2="620" y2="184" stroke="#f1f5f9"/>
      <text x="320" y="212" fill="#94a3b8">DOKU Ref No</text>
      <text x="620" y="212" text-anchor="end" fill="#334155" font-family="monospace">A1B2C3D4E5F6</text>
      <line x1="320" y1="224" x2="620" y2="224" stroke="#f1f5f9"/>
      <text x="320" y="252" fill="#94a3b8">Amount</text>
      <text x="620" y="252" text-anchor="end" fill="#334155" font-weight="600">Rp 25.000</text>
      <line x1="320" y1="264" x2="620" y2="264" stroke="#f1f5f9"/>
      <text x="320" y="292" fill="#94a3b8">Created</text>
      <text x="620" y="292" text-anchor="end" fill="#334155">13 Feb 2026, 14:02</text>
      <line x1="320" y1="304" x2="620" y2="304" stroke="#f1f5f9"/>
      <text x="320" y="332" fill="#94a3b8">Valid until</text>
      <text x="620" y="332" text-anchor="end" fill="#334155">13 Feb 2026, 14:32</text>
    </g>

    <!-- timeline -->
    <text x="100" y="392" font-size="12" font-weight="700" fill="#94a3b8">TIMELINE</text>
    <circle cx="108" cy="414" r="7" fill="#e2e8f0"/><text x="128" y="418" font-size="12" fill="#334155">PENDING · Transaction created</text>
    <circle cx="108" cy="440" r="7" fill="#d1fae5"/><text x="128" y="444" font-size="12" fill="#334155">SUCCESS · Simulated by developer</text>

    <!-- footer buttons -->
    <rect x="100" y="470" width="180" height="34" rx="10" fill="#0f172a"/>
    <text x="190" y="492" text-anchor="middle" font-size="13" fill="#ffffff">Query Status</text>
    <rect x="292" y="470" width="120" height="34" rx="10" fill="#f1f5f9"/>
    <text x="352" y="492" text-anchor="middle" font-size="13" fill="#475569">Cancel</text>
    <rect x="424" y="470" width="150" height="34" rx="10" fill="#fef3c7"/>
    <text x="499" y="492" text-anchor="middle" font-size="13" fill="#b45309">Refund</text>
  </g>
</svg>
